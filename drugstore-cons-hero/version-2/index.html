<!DOCTYPE html>
<html lang="uk">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cons Hero — Spheres, version 2</title>
	<link rel="preload" href="../assets/fonts/TwidGrotesk-Regular.woff2" as="font" type="font/woff2" crossorigin>
	<!-- ?v= only so a plain reload can't serve a stale file while we're iterating; drop it on port -->
	<link rel="stylesheet" href="style.css?v=1">
</head>
<body>

	<main class="page">
		<section class="cons-hero" aria-label="Консультації">
			<!-- fixed-size stage (config.width × config.height); scaled down as a whole on narrow screens -->
			<div class="ch-stage">
				<h2 class="ch-title">Консультації</h2>

				<!-- spheres are generated from SPHERES + config in assets/script.js -->
				<div class="ch-bubbles"></div>
			</div>
		</section>
	</main>

	<!-- CONFIG PANEL -->
	<button class="cfg-toggle" type="button" title="Toggle config (C)" aria-label="Toggle config">⚙</button>

	<aside class="cfg-panel">
		<div class="cfg-head">
			<span>Config</span>
			<span>press C</span>
		</div>

		<!-- Desktop and Mobile are separate configs; the active tab is what renders live -->
		<div class="cfg-tabs" role="tablist">
			<button type="button" class="cfg-tab" data-device="desktop" role="tab">Desktop</button>
			<button type="button" class="cfg-tab" data-device="mobile" role="tab">Mobile</button>
		</div>
		<p class="cfg-tabs-hint"></p>

		<div class="cfg-body">
			<!-- controls are generated from SCHEMA in assets/script.js -->
			<div class="cfg-out">
				<p class="cfg-info"></p>
				<h3>JSON</h3>
				<textarea readonly spellcheck="false"></textarea>
			</div>
		</div>

		<div class="cfg-foot">
			<button type="button" data-action="copy">Copy</button>
			<button type="button" data-action="intro">Intro</button>
			<button type="button" data-action="reset">Reset</button>
		</div>
	</aside>

	<!-- EFFECT CODE -->
	<script src="script.js?v=1"></script>
</body>
</html>
